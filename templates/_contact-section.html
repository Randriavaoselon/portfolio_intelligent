{% load static %}
<section id="contact" class="contact-section">
    <div class="container">
        <div class="row contact-row shadow-box">

            <div class="col-contact-form">
                <form action="#" method="POST" class="contact-form" id="contact-form">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="text" id="company_name" name="company_name" placeholder="Nom d'entreprise"
                            required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="subject" name="subject" placeholder="Sujet" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="Votre Email" required>
                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" rows="5" placeholder="Votre Message"
                            required></textarea>
                    </div>
                    <button type="submit" class="btn-submit" id="btn-submit">Envoyer le message</button>
                    <div id="form-response"></div>
                </form>
            </div>

            <div class="col-contact-info highlighted-info">
                <h4 class="info-title">Parlons de votre projet</h4>
                <p class="info-text">
                    Disponible pour de nouvelles opportunités de collaboration.
                    N'hésitez pas à me contacter pour discuter de vos besoins techniques.
                </p>
                <ul class="info-details">
                    <li><i class="fas fa-phone"></i> <span>Téléphone :</span> +261 32 14 146 19</li>
                    <li><i class="fas fa-envelope"></i> <span>Email :</span> selonrandriavao@gmail.com</li>
                    <li><i class="fas fa-map-marker-alt"></i> <span>Adresse :</span> Mahajanga, Madagascar
                    </li>
                </ul>
            </div>

        </div>
    </div>
</section>
